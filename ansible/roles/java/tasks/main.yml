- name: Install APT prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Remove existing HashiCorp repository
  file:
    path: /etc/apt/sources.list.d/hashicorp.list
    state: absent

- name: Remove existing HashiCorp keyring
  file:
    path: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    state: absent

- name: Download HashiCorp GPG key
  get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /tmp/hashicorp.gpg
    mode: "0644"
    force: true

- name: Install HashiCorp GPG key
  shell: |
    gpg --dearmor --yes \
      -o /usr/share/keyrings/hashicorp-archive-keyring.gpg \
      /tmp/hashicorp.gpg

- name: Set HashiCorp keyring permissions
  file:
    path: /usr/share/keyrings/hashicorp-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Verify HashiCorp GPG key
  command:
    cmd: >
      gpg --no-default-keyring
      --keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg
      --fingerprint
  register: hashicorp_key
  changed_when: false

- name: Display HashiCorp GPG fingerprint
  debug:
    var: hashicorp_key.stdout_lines

- name: Configure HashiCorp repository
  copy:
    dest: /etc/apt/sources.list.d/hashicorp.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Java
  apt:
    name: openjdk-21-jdk
    state: present
