---
- name: Install APT prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Create APT keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# 👇 PUT THE NEW FIX HERE
- name: Remove stale HashiCorp keyring
  file:
    path: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
    state: absent

- name: Download HashiCorp repository key
  get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /tmp/hashicorp.gpg
    mode: "0644"
    force: true

- name: Convert HashiCorp key to keyring
  shell: |
    gpg --dearmor --yes \
      -o /etc/apt/keyrings/hashicorp-archive-keyring.gpg \
      /tmp/hashicorp.gpg

- name: Set HashiCorp keyring permissions
  file:
    path: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Configure HashiCorp APT repository
  copy:
    dest: /etc/apt/sources.list.d/hashicorp.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Java
  apt:
    name: openjdk-21-jdk
    state: present

- name: Verify Java
  command: java -version
  register: java_version
  changed_when: false
  ignore_errors: true

- debug:
    var: java_version.stderr_lines
