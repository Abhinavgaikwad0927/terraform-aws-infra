---
- name: Install Docker
  apt:
    name: docker.io
    state: present

- name: Enable Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Verify Docker
  command: docker --version
  register: docker_version
  changed_when: false

- debug:
    var: docker_version.stdout
