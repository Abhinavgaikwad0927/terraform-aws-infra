apiVersion: apps/v1
kind: Deployment

metadata:
  name: project-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: project-app

  template:
    metadata:
      labels:
        app: project-app

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: project-app
          image: 025232685400.dkr.ecr.ap-south-1.amazonaws.com/project-ecr:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service

metadata:
  name: project-app

spec:
  type: NodePort

  selector:
    app: project-app

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
