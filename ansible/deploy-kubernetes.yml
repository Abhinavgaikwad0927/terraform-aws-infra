---
- name: Install and Deploy Kubernetes
  hosts: servers
  become: yes

  tasks:

    # ---------------------------------------------------------
    # APT + DOCKER
    # ---------------------------------------------------------

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Kubernetes prerequisites
      apt:
        name:
          - curl
          - conntrack
          - docker.io
          - socat
        state: present

    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to Docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # ---------------------------------------------------------
    # KUBECTL
    # ---------------------------------------------------------

    - name: Check whether kubectl exists
      stat:
        path: /usr/local/bin/kubectl
      register: kubectl_binary

    - name: Download kubectl
      shell: |
        curl -L -o /tmp/kubectl \
          "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      when: not kubectl_binary.stat.exists

    - name: Install kubectl
      command:
        cmd: install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      when: not kubectl_binary.stat.exists

    # ---------------------------------------------------------
    # MINIKUBE
    # ---------------------------------------------------------

    - name: Check whether Minikube exists
      stat:
        path: /usr/local/bin/minikube
      register: minikube_binary

    - name: Download Minikube
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /tmp/minikube
        mode: '0755'
      when: not minikube_binary.stat.exists

    - name: Install Minikube
      command:
        cmd: install /tmp/minikube /usr/local/bin/minikube
      when: not minikube_binary.stat.exists

    # ---------------------------------------------------------
    # CLEAN OLD MINIKUBE
    # ---------------------------------------------------------

    - name: Delete existing Minikube cluster
      become_user: ubuntu
      shell: |
        minikube delete --all --purge
      changed_when: false
      failed_when: false

    # ---------------------------------------------------------
    # CLEAN DISK
    # ---------------------------------------------------------

    - name: Remove unused Docker resources
      shell: |
        docker system prune -af --volumes
      changed_when: false
      failed_when: false

    - name: Remove unused APT packages and cache
      shell: |
        apt-get autoremove -y
        apt-get clean
        rm -rf /var/lib/apt/lists/*
      changed_when: false
      failed_when: false

    # ---------------------------------------------------------
    # START MINIKUBE
    # ---------------------------------------------------------

    - name: Start Minikube
      become_user: ubuntu
      shell: |
        minikube start \
          --driver=docker \
          --memory=3000 \
          --cpus=2 \
          --ports=30080 \
          --ports=30090 \
          --ports=30300 \
          --listen-address=0.0.0.0
      register: minikube_start
      retries: 3
      delay: 30
      until: minikube_start.rc == 0

    # ---------------------------------------------------------
    # WAIT FOR KUBERNETES
    # ---------------------------------------------------------

    - name: Wait for Kubernetes API
      become_user: ubuntu
      shell: |
        kubectl get nodes
      register: kubernetes_nodes
      retries: 12
      delay: 10
      until: kubernetes_nodes.rc == 0
      changed_when: false

    # ---------------------------------------------------------
    # DISCOVER MINIKUBE HOST PORTS
    # ---------------------------------------------------------

    - name: Get Minikube Docker port mappings
      shell: |
        docker port minikube
      register: minikube_port_output
      changed_when: false

    - name: Display Minikube port mappings
      debug:
        var: minikube_port_output.stdout_lines

    - name: Extract application host port
      shell: |
        docker port minikube 30080/tcp | head -1 | sed 's/.*://'
      register: app_host_port
      changed_when: false

    - name: Extract Prometheus host port
      shell: |
        docker port minikube 30090/tcp | head -1 | sed 's/.*://'
      register: prometheus_host_port
      changed_when: false

    - name: Extract Grafana host port
      shell: |
        docker port minikube 30300/tcp | head -1 | sed 's/.*://'
      register: grafana_host_port
      changed_when: false

    - name: Display discovered forwarding ports
      debug:
        msg:
          - "Application: 30080 -> {{ app_host_port.stdout }}"
          - "Prometheus: 30090 -> {{ prometheus_host_port.stdout }}"
          - "Grafana: 30300 -> {{ grafana_host_port.stdout }}"

    # ---------------------------------------------------------
    # CREATE TCP FORWARDING SERVICES
    # ---------------------------------------------------------

    - name: Create application forwarding service
      copy:
        dest: /etc/systemd/system/minikube-app-forward.service
        mode: '0644'
        content: |
          [Unit]
          Description=Forward EC2 port 30080 to Minikube application
          After=network.target docker.service
          Requires=docker.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/socat TCP-LISTEN:30080,reuseaddr,fork TCP4:127.0.0.1:{{ app_host_port.stdout }}
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: Create Prometheus forwarding service
      copy:
        dest: /etc/systemd/system/minikube-prometheus-forward.service
        mode: '0644'
        content: |
          [Unit]
          Description=Forward EC2 port 30090 to Minikube Prometheus
          After=network.target docker.service
          Requires=docker.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/socat TCP-LISTEN:30090,reuseaddr,fork TCP4:127.0.0.1:{{ prometheus_host_port.stdout }}
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: Create Grafana forwarding service
      copy:
        dest: /etc/systemd/system/minikube-grafana-forward.service
        mode: '0644'
        content: |
          [Unit]
          Description=Forward EC2 port 30300 to Minikube Grafana
          After=network.target docker.service
          Requires=docker.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/socat TCP-LISTEN:30300,reuseaddr,fork TCP4:127.0.0.1:{{ grafana_host_port.stdout }}
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable application forwarding
      systemd:
        name: minikube-app-forward
        enabled: yes
        state: restarted

    - name: Enable Prometheus forwarding
      systemd:
        name: minikube-prometheus-forward
        enabled: yes
        state: restarted

    - name: Enable Grafana forwarding
      systemd:
        name: minikube-grafana-forward
        enabled: yes
        state: restarted

    # ---------------------------------------------------------
    # KUBERNETES FILES
    # ---------------------------------------------------------

    - name: Create Kubernetes directory
      file:
        path: /home/ubuntu/kubernetes
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy Kubernetes files
      copy:
        src: "{{ playbook_dir }}/roles/kubernetes/"
        dest: /home/ubuntu/kubernetes/
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    # ---------------------------------------------------------
    # ECR SECRET
    # ---------------------------------------------------------

    - name: Create ECR secret
      become_user: ubuntu
      shell: |
        kubectl create secret docker-registry ecr-secret \
          --docker-server=025232685400.dkr.ecr.ap-south-1.amazonaws.com \
          --docker-username=AWS \
          --docker-password="$(aws ecr get-login-password --region ap-south-1)" \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash

    # ---------------------------------------------------------
    # PROMETHEUS CONFIG
    # ---------------------------------------------------------

    - name: Deploy Prometheus Config
      become_user: ubuntu
      command:
        cmd: kubectl apply -f /home/ubuntu/kubernetes/prometheus-config.yaml

    # ---------------------------------------------------------
    # APPLICATION
    # ---------------------------------------------------------

    - name: Deploy Application
      become_user: ubuntu
      command:
        cmd: kubectl apply -f /home/ubuntu/kubernetes/app-pod.yaml

    # ---------------------------------------------------------
    # PROMETHEUS
    # ---------------------------------------------------------

    - name: Deploy Prometheus
      become_user: ubuntu
      command:
        cmd: kubectl apply -f /home/ubuntu/kubernetes/prometheus-pod.yaml

    - name: Restart Prometheus
      become_user: ubuntu
      command:
        cmd: kubectl rollout restart deployment/prometheus

    # ---------------------------------------------------------
    # GRAFANA
    # ---------------------------------------------------------

    - name: Deploy Grafana
      become_user: ubuntu
      command:
        cmd: kubectl apply -f /home/ubuntu/kubernetes/grafana-pod.yaml

    - name: Restart Grafana
      become_user: ubuntu
      command:
        cmd: kubectl rollout restart deployment/grafana

    # ---------------------------------------------------------
    # WAIT FOR DEPLOYMENTS
    # ---------------------------------------------------------

    - name: Wait for application deployment
      become_user: ubuntu
      command:
        cmd: kubectl rollout status deployment/project-app --timeout=180s

    - name: Wait for Prometheus deployment
      become_user: ubuntu
      command:
        cmd: kubectl rollout status deployment/prometheus --timeout=180s

    - name: Wait for Grafana deployment
      become_user: ubuntu
      command:
        cmd: kubectl rollout status deployment/grafana --timeout=180s

    # ---------------------------------------------------------
    # VERIFY KUBERNETES
    # ---------------------------------------------------------

    - name: Check Kubernetes resources
      become_user: ubuntu
      command:
        cmd: kubectl get deployments,pods,services -o wide
      register: kubernetes_status
      changed_when: false

    - name: Display Kubernetes resources
      debug:
        var: kubernetes_status.stdout_lines

    # ---------------------------------------------------------
    # VERIFY FORWARDING
    # ---------------------------------------------------------

    - name: Check application forwarding service
      command:
        cmd: systemctl is-active minikube-app-forward
      register: app_forward_status
      changed_when: false

    - name: Check Prometheus forwarding service
      command:
        cmd: systemctl is-active minikube-prometheus-forward
      register: prometheus_forward_status
      changed_when: false

    - name: Check Grafana forwarding service
      command:
        cmd: systemctl is-active minikube-grafana-forward
      register: grafana_forward_status
      changed_when: false

    - name: Display forwarding status
      debug:
        msg:
          - "Application forwarding: {{ app_forward_status.stdout }}"
          - "Prometheus forwarding: {{ prometheus_forward_status.stdout }}"
          - "Grafana forwarding: {{ grafana_forward_status.stdout }}"
